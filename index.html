  <!-- Instant Dark/Light Electric Blue Favicon & Theme Sync -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('vtaper_tracker_state_v5');
        var theme = raw ? (JSON.parse(raw).theme || 'dark') : 'dark';
        var isLight = theme === 'light';
        var html = document.documentElement;
        html.dataset.theme = theme;
        html.classList.toggle('dark', !isLight);
        html.classList.toggle('light', isLight);

        var bg = isLight ? '#F4F4F2' : '#000000';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);

        var svg = isLight
          ? "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='none'><rect width='512' height='512' rx='112' fill='#FFFFFF'/><rect x='76' y='116' width='360' height='20' rx='6' fill='#D6D6D1'/><rect x='92' y='96' width='24' height='60' rx='6' fill='#0059FF'/><rect x='396' y='96' width='24' height='60' rx='6' fill='#0059FF'/><path d='M88 156H188L256 348L324 156H424L292 428H220L88 156Z' fill='#0059FF'/><polygon points='208,156 304,156 256,284' fill='#000000'/><rect x='212' y='444' width='88' height='12' rx='6' fill='#D6D6D1'/></svg>"
          : "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='none'><rect width='512' height='512' rx='112' fill='#000000'/><rect x='76' y='116' width='360' height='20' rx='6' fill='#27272A'/><rect x='92' y='96' width='24' height='60' rx='6' fill='#0066FF'/><rect x='396' y='96' width='24' height='60' rx='6' fill='#0066FF'/><path d='M88 156H188L256 348L324 156H424L292 428H220L88 156Z' fill='#0066FF'/><polygon points='208,156 304,156 256,284' fill='#FFFFFF'/><rect x='212' y='444' width='88' height='12' rx='6' fill='#27272A'/></svg>";

        var icon = document.getElementById('vt-favicon');
        if (icon) icon.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
      } catch (e) {}
    })();
  </script>
